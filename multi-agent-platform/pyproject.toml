[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Production-oriented multi-agent platform on Microsoft Agent Framework and Foundry"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "agent-framework-core>=1.17.0",
    "azure-identity>=1.15.0",
    "azure-core>=1.30.0",
    "azure-ai-projects>=2.0.0b1",
    "azure-search-documents>=11.7.0b2",
    "openai>=1.0.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.1.0",
]
sessions = [
    "redis>=5.0.0",
]
observability = [
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_platform"]
