# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: hosted-agents-workshop

services:
  # Foundry project + model deployment. `azd provision` creates these.
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4o
        model:
          format: OpenAI
          name: gpt-4o
          version: '2024-11-20'
        sku:
          name: GlobalStandard
          capacity: 10

  # The hosted agent. Code-deploy: azd zips src/AssistantAgent and builds the runtime remotely.
  AssistantAgent:
    host: azure.ai.agent
    project: src/AssistantAgent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: AssistantAgent
    description: >-
      A friendly assistant that answers with live data using local tools:
      weather, current time, and a demo Contoso product catalog.
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Responses Protocol
        - Local Tools
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
